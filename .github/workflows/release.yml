name: Release

# Ein Tag wie v1.2.3 (oder v1.2.3-rc.1) baut die Pakete für Linux (x64 und arm64) und veröffentlicht sie als GitHub-Release.
# Das Install-Script (deploy/install.sh) lädt genau diese Dateien. Das Script selbst gehört ebenfalls zum Release: Der Befehl im
# README zeigt auf releases/latest/download/install.sh statt auf einen beweglichen Zweig, denn es läuft mit Root-Rechten.
# Pakete und Script bekommen eine Herkunftsbestätigung (Attestierung); sie lässt sich mit "gh attestation verify" prüfen.
#
# Die Aktionen sind auf Commit-SHAs festgelegt (der Kommentar nennt die Version): Ein verschobener Tag in einer fremden
# Aktion könnte sonst unbemerkt anderen Code in dieses Release bringen. Dependabot schlägt Aktualisierungen vor.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tag prüfen
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Der Tag '$GITHUB_REF_NAME' hat nicht die Form vMAJOR.MINOR.PATCH (optional mit -Zusatz)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag muss auf dem Hauptzweig liegen
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Sonst könnte jeder mit Schreibrecht einen Tag auf einen beliebigen Zweig setzen und damit ein offizielles Release bauen.
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Der Tag '$GITHUB_REF_NAME' zeigt auf einen Commit, der nicht auf '$DEFAULT_BRANCH' liegt."
            exit 1
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Tests
        run: dotnet test --configuration Release

  # Das Install-Script läuft mit Root-Rechten auf den Servern der Nutzer: Es wird vor dem Veröffentlichen in Debian- und
  # Ubuntu-Containern geprüft (Installation, Update, Rollback, Downgrade-Schutz, Deinstallation).
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Installer-Tests in Containern
        run: bash deploy/test/run-container-tests.sh

  build:
    needs: [test, installer]
    runs-on: ubuntu-latest
    # Die Pakete werden gleich nach dem Packen attestiert, also im Job, der sie gebaut hat. Der Release-Job prüft diese
    # Bestätigung vor dem Veröffentlichen: Ein auf dem Weg über den Artefakt-Speicher getauschtes Paket fiele dort auf.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Veröffentlichen (${{ matrix.rid }})
        run: |
          dotnet publish Wunschkino/Wunschkino.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="${GITHUB_REF_NAME#v}" \
            --output publish
      - name: Paket packen
        run: |
          tar --owner=0 --group=0 --numeric-owner -C publish -czf "wunschkino-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" .
      - name: Herkunft bestätigen (Attestierung)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: wunschkino-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paket-${{ matrix.rid }}
          path: wunschkino-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    # Das Environment „release“ legt der Eigentümer in den Repository-Einstellungen an und trägt sich als Prüfer ein (Settings → Environments → New environment, Name „release“,
    # Required reviewers). Dann wartet dieser Job vor dem Veröffentlichen auf eine Freigabe: Ein versehentlich oder mit einem
    # gestohlenen Zugang gesetzter Tag veröffentlicht nichts. Ohne eingerichtetes Environment legt GitHub es ohne Schutz an.
    environment: release
    permissions:
      contents: write
      # Für die Herkunftsbestätigung: Der Job beweist über ein kurzlebiges OIDC-Token, dass er in diesem Repository lief.
      id-token: write
      attestations: write
    steps:
      # Nur das Install-Script wird ausgecheckt; es gehört zum Release, damit der README-Befehl auf einen festen Stand zeigt.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: deploy/install.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: paket-*
          merge-multiple: true
      - name: Install-Script beilegen und Prüfsummen erzeugen
        run: |
          cp deploy/install.sh install.sh
          sha256sum wunschkino-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Pakete gegen die Attestierung aus dem Build-Job prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in wunschkino-*.tar.gz; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Herkunft des Install-Scripts bestätigen (Attestierung)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: install.sh
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" wunschkino-*.tar.gz SHA256SUMS install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
